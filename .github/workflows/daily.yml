name: 每日推荐

# 每天生成一份当天的「每日推荐」并提交，部署平台收到提交后重新构建。
# 顺带同步 Emby 曲库与歌单（新歌、新歌单、新封面），前提是仓库里配了
# EMBY_URL / EMBY_API_KEY 两个 secret —— 没配就跳过，只用已有快照。
# 推荐语还可以交给模型写成文艺随笔，前提是配了 AI_API_KEY（见下面的步骤说明）；
# 没配也一样能跑，只是推荐语由模板算出来。
#
# 时间：cron 只认 UTC，16:05 UTC = 北京 00:05 —— 错开整点是因为 GitHub 的
# 定时任务在整点排队最严重，经常延迟十几分钟到一小时。
on:
  schedule:
    - cron: '5 16 * * *'
  workflow_dispatch: # 手动补跑：仓库 Actions 页面 → Run workflow

permissions:
  contents: write # 要提交 public/daily.json

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      # 决定脚本里「今天」是哪一天：这一步跑在北京 00:05，用 UTC 会算成昨天
      TZ: Asia/Shanghai
    steps:
      # 都用 v7：v4 那代还跑在 Node 20 上，GitHub 已弃用该运行时并会打 annotation
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 要 rebase，浅克隆下历史不全

      # gen-daily.mjs 通过 scripts/load-ts.mjs 用 esbuild 加载 src/lib/daily.ts
      # （与前端共用同一份选歌规则），所以这里必须真的装依赖，不能只 setup-node。
      # Node 选 22 是因为 load-ts 不依赖版本特性，但 esbuild 需要能装上。
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # Emby 侧的新歌 / 新歌单靠这一步进仓库。没配 secret 时脚本自己打印一句
      # 「跳过 Emby 同步」并沿用已有快照，所以这里不用加 if —— 顺带避开了
      # step 级 if 里读不到 secrets 上下文的限制（那会直接让 workflow 解析失败）。
      - name: 同步 Emby 曲库与歌单
        env:
          EMBY_URL: ${{ secrets.EMBY_URL }}
          EMBY_API_KEY: ${{ secrets.EMBY_API_KEY }}
        run: node scripts/gen-emby.mjs

      # 歌手简介与 Apple Music 专辑推荐语。不需要密钥（维基百科公开），
      # 但配了 LASTFM_API_KEY 会优先用它 —— CI 在境外，维基可达；
      # 本地在国内通常连不上，脚本会自动跳过该站点而不是干等超时。
      - name: 同步歌手资料
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: node scripts/gen-artists.mjs

      # 配了 AI_* 就顺手让模型把推荐语重写成一段文艺随笔；没配、或调用失败（含超时），
      # 脚本自己退回模板文案，所以这里不用加 if。base_url 与 model 不是机密，
      # 写成 `secrets.X || vars.X` 让两种都认，省得纠结该放 secrets 还是 variables。
      # 密钥只活在这一步的环境里，不进任何产物 —— 与 EMBY_API_KEY 同理。
      - name: 生成 public/daily.json
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY || vars.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL || vars.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL || vars.AI_MODEL }}
        run: node scripts/gen-daily.mjs

      - name: 提交并推送
        run: |
          # emby.json / emby-covers / emby-lyrics 一并提交：Emby 的新歌、新歌单、
          # 新封面与新歌词只有同步进仓库才会进下一次构建，也才会进入之后的选歌池。
          # 歌词是内嵌在音频里的，只能下头部解析，所以必须落库复用（见 gen-emby.mjs）。
          git add public/daily.json public/emby.json public/emby-covers public/emby-lyrics public/artists.json
          if git diff --cached --quiet; then
            echo "日期与曲目都和上次一样，跳过提交"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(daily): 每日推荐与 Emby 同步 $(date +%F)"
          # 先 rebase 再推，不然撞上别处的提交会因非快进失败。
          # -X theirs 是必须的：这几个产物都是「同源快照、整体重写」，谁新谁对 ——
          # 本次刚生成的内容一定不比远程旧，冲突时不必人工介入。
          # 注意 rebase 语境下 theirs 指的是「正在被应用的那个提交」，也就是本次产物
          # （与 merge 里的含义相反，别按直觉读）。
          git pull --rebase --autostash -X theirs
          git push
